name: Refresh README screenshots

on:
  push:
    paths:
      - 'assets/mainscreenshots/*'

permissions:
  contents: write

jobs:
  refresh-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate gallery
        run: python3 scripts/update-readme-screenshots.py
      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet -- README.md; then
            git commit -m "Refresh README screenshots"
            git push
          fi
