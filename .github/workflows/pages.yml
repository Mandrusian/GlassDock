name: Deploy GlassDock website

on:
  push:
    branches: [master]
    paths:
      - "index.html"
      - "assets/site.css"
      - "assets/site.js"
      - "assets/liquid-glass-init.js"
      - "assets/liquid-glass/**"
      - "assets/glassdock.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate installer shell scripts
        run: |
          bash -n installer.sh
          bash -n extras/GlassIcon/install.sh
          bash -n extras/GlassIcon/uninstall.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static website
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/site.css assets/site.js assets/liquid-glass-init.js assets/glassdock.svg _site/assets/
          cp -R assets/liquid-glass _site/assets/
          touch _site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
